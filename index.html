<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Search - DOM Manipulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            background: #f9f9f9;
            margin-bottom: 5px;
            padding: 12px;
            border-radius: 4px;
            border-left: 4px solid #007bff;
        }
    </style>
</head>
<body>

    <h2>Cari Buah</h2>
    <!-- Input untuk pencarian -->
    <input type="text" id="searchInput" placeholder="Cari buah di sini...">
    
    <!-- List hasil pencarian -->
    <ul id="resultList"></ul>

    <script>
        // Master data list
        const dataList = [
            "Apel", "Pisang", "Jeruk", "Mangga", "Anggur", 
            "Semangka", "Melon", "Durian", "Nanas", "Stroberi", 
            "Alpukat", "Kelapa", "Kiwi", "Manggis", "Rambutan",
            "Sirsak", "Jambu", "Belimbing", "Pepaya", "Leci"
        ];

        // Referensi elemen DOM
        const searchInput = document.getElementById('searchInput');
        const resultList = document.getElementById('resultList');

        // Render list data ke DOM
        function renderList(items) {
            // Clear ul data terlebih dahulu sebelum re-render.
            // Digunakan textContent = '' sebagai pengganti innerHTML = '' yang dilarang.
            resultList.textContent = '';

            // Jika tidak ada data yang cocok
            if (items.length === 0) {
                const liElement = document.createElement('li');
                liElement.textContent = "Data tidak ditemukan.";
                resultList.appendChild(liElement);
                return;
            }

            // Loop untuk setiap item, buat elemen <li> dengan createElement, 
            // lalu isi menggunakan textContent.
            items.forEach(item => {
                const liElement = document.createElement('li');
                liElement.textContent = item; // Menggunakan textContent dengan ketat
                resultList.appendChild(liElement);
            });
        }

        // Render data utuh saat pertama kali halaman dimuat
        renderList(dataList);

        // Event Listener untuk input event (Live Search)
        searchInput.addEventListener('input', function(event) {
            const keyword = event.target.value.toLowerCase();
            
            // Filter array berdasarkan input pengguna
            const filteredData = dataList.filter(item => 
                item.toLowerCase().includes(keyword)
            );
            
            // Re-render dengan data yang sudah difilter
            renderList(filteredData);
        });
    </script>
</body>
</html>
